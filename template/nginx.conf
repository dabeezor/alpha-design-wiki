# Static portal server. This replaces the stock nginx default.conf, which sends
# no Cache-Control header. Without one, browsers apply heuristic freshness to
# app.js, styles.css and services.json and reuse an old copy without asking, so
# a new release showed the new index.html with the old script (2026-09-25).
#
# no-cache does NOT mean "do not cache". It means "revalidate before reuse": the
# browser sends If-None-Match with the file's ETag and nginx answers 304 with no
# body when nothing changed. Every file here is small, so the check is cheap and
# a normal reload always shows the current release.
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control "no-cache" always;
}
